<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grocery Price Per Unit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Grocery price per unit</h1>
    <p>Shared settings for Walmart, Real Canadian Superstore, No Frills, and Save-On-Foods.</p>
    <label for="default-sort-mode">Default sorting</label>
    <select id="default-sort-mode">
      <option value="restore">Website order</option>
      <option value="auto-asc">Automatic: low to high</option>
      <option value="auto-desc">Automatic: high to low</option>
      <option value="mass-asc">Mass $/kg: low to high</option>
      <option value="mass-desc">Mass $/kg: high to low</option>
      <option value="volume-asc">Volume $/L: low to high</option>
      <option value="volume-desc">Volume $/L: high to low</option>
      <option value="count-asc">Count $/each: low to high</option>
      <option value="count-desc">Count $/each: high to low</option>
      <option value="total-asc">Total price: low to high</option>
      <option value="total-desc">Total price: high to low</option>
    </select>
    <section class="retailers" aria-labelledby="retailer-links">
      <h2 id="retailer-links">Shop</h2>
      <div class="retailer-grid">
        <a href="https://www.walmart.ca/" target="_blank" rel="noreferrer">Walmart</a>
        <a href="https://www.realcanadiansuperstore.ca/" target="_blank" rel="noreferrer">Superstore</a>
        <a href="https://www.nofrills.ca/" target="_blank" rel="noreferrer">No Frills</a>
        <a href="https://www.saveonfoods.com/" target="_blank" rel="noreferrer">Save-On-Foods</a>
      </div>
    </section>
    <output id="saved" aria-live="polite"></output>
    <p class="note">All stores use the same $/kg, $/L, and $/each labels. The floating page menu can override this default.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
